name: Build IncoWen Mono

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      package_name: ${{ steps.package.outputs.name }}
    steps:
      - name: Check out IncoWen Mono
        uses: actions/checkout@v7
        with:
          path: IncoWen-Mono
          persist-credentials: false

      - name: Check out Inconsolata 3.100
        uses: actions/checkout@v7
        with:
          repository: cyrealtype/Inconsolata
          ref: fc1fc21081558b39a2db43bfd9b65bf9acb50701
          path: Inconsolata
          persist-credentials: false

      - name: Check out LXGW WenKai Mono Lite 1.522
        uses: actions/checkout@v7
        with:
          repository: lxgw/LxgwWenKai-Lite
          ref: 4cddacbe244b0a24b10076369105f0495e5ec898
          path: LxgwWenKai-Lite
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependency
        working-directory: IncoWen-Mono
        run: python -m pip install -r requirements.txt

      - name: Build Regular and Bold fonts
        working-directory: IncoWen-Mono
        run: ./build-family.sh

      - name: Build WOFF2 web fonts and site
        working-directory: IncoWen-Mono
        run: ./build-webfonts.sh

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Check font metadata and metrics
        working-directory: IncoWen-Mono
        run: |
          python - <<'PY'
          from pathlib import Path
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont

          paths = [
              Path("dist/IncoWenMono-Regular.ttf"),
              Path("dist/IncoWenMono-Bold.ttf"),
          ]
          for path in paths:
              font = TTFont(path, checkChecksums=2)
              names = font["name"]
              cmap = font.getBestCmap()
              os2 = font["OS/2"]
              assert names.getDebugName(1) == "IncoWen Mono"
              assert names.getDebugName(0) and "Inconsolata" in names.getDebugName(0)
              assert "wght=" in names.getDebugName(10) and "wdth=" in names.getDebugName(10)
              assert "SIL OPEN FONT LICENSE Version 1.1" in names.getDebugName(13)
              assert "fvar" not in font
              assert font["hmtx"].metrics[cmap[0x41]][0] == 500
              assert font["hmtx"].metrics[cmap[0x4E2D]][0] == 1000
              assert os2.ulCodePageRange1 & (1 << 18)
              assert not os2.ulCodePageRange1 & (1 << 20)
              assert font["meta"].data["dlng"] == "Latn,Hans"
              assert font["meta"].data["slng"] == "Latn,Hans"
              assert any(
                  record.FeatureTag == "dlig"
                  for record in font["GSUB"].table.FeatureList.FeatureRecord
              )
          source_path = Path("../Inconsolata/fonts/variable/Inconsolata[wdth,wght].ttf")
          for path, axes in zip(
              paths,
              ({"wdth": 87.5, "wght": 350}, {"wdth": 90, "wght": 650}),
          ):
              source = instantiateVariableFont(
                  TTFont(source_path), axes, inplace=True
              )
              source_name = source.getBestCmap()[0x41]
              source_glyph = source["glyf"][source_name]
              source_glyph.recalcBounds(source["glyf"])
              expected_width = source_glyph.xMax - source_glyph.xMin
              font = TTFont(path)
              glyph_name = font.getBestCmap()[0x41]
              glyph = font["glyf"][glyph_name]
              assert glyph.xMax - glyph.xMin == expected_width
          assert len(paths) == 2
          PY

      - name: Package fonts and licenses
        id: package
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            name="IncoWenMono-${GITHUB_REF_NAME}.zip"
          else
            name="IncoWenMono-${GITHUB_SHA:0:7}.zip"
          fi
          cd IncoWen-Mono
          zip -r "../$name" \
            OFL.txt \
            dist/IncoWenMono-Regular.ttf dist/IncoWenMono-Bold.ttf \
            site/IncoWenMono.css site/woff2
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: incowen-font-package
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: IncoWen-Mono/site

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download font package
        uses: actions/download-artifact@v8
        with:
          name: incowen-font-package
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/$PACKAGE_NAME" \
            --title "IncoWen Mono $GITHUB_REF_NAME" \
            --notes-file RELEASE-NOTES.md

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy web fonts
        id: deployment
        uses: actions/deploy-pages@v4
